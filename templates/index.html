<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillForge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-mark">
                <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2 5h4v2H2zm0 4h4v2H2zm8-4h4v2h-4zm0 4h4v2h-4zM7 7l2 1-2 1V7z" fill="#090d16"/>
                </svg>
            </div>
            <span class="logo-text">SkillForge</span>
        </div>
        <div style="display:flex;align-items:center;gap:1.5rem;">
            <div class="nav-links">
                <a href="/" class="nav-link active">Transform</a>
                <a href="/generator" class="nav-link">Skill Generator</a>
                <a href="#" class="nav-link" onclick="event.preventDefault(); toggleLogPanel()">Logs</a>
            </div>
            <div class="header-status">
                <div class="status-dot connected" id="statusDot"></div>
                <span id="statusText">LM Studio connected</span>
            </div>
        </div>
    </header>

    <div class="workspace">
        <!-- Left: Controls -->
        <div class="controls">
            <div class="panel-section">
                <div style="display:flex;align-items:center;justify-content:space-between;">
                    <div class="panel-label">Skill</div>
                    <button class="btn-add-output" onclick="document.getElementById('skillUploadInput').click()" title="Upload skill .md file">+ Upload</button>
                    <input type="file" id="skillUploadInput" accept=".md" style="display:none" onchange="uploadSkillFile(this)">
                </div>
                <div class="skill-list" id="skillsGrid"></div>
            </div>

            <div class="panel-section">
                <div class="panel-label">Input</div>
                <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
                    <button class="btn-change-file" onclick="event.stopPropagation(); clearFile()" title="Change file" aria-label="Remove selected file">&times;</button>
                    <div class="upload-icon">
                        <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9 2v10M5 6l4-4 4 4M3 13v2h12v-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <p class="upload-text"><strong>Drop file</strong> or click to browse</p>
                    <input type="file" id="fileInput" accept=".csv,.txt,.json,.xlsx">
                </div>
            </div>

            <div class="panel-actions">
                <button class="btn-process" id="processBtn" disabled onclick="processFile()">
                    <svg viewBox="0 0 16 16" fill="none"><path d="M5 3l6 5-6 5V3z" fill="currentColor"/></svg>
                    Transform
                    <span class="kbd-hint">Ctrl+Enter</span>
                </button>
            </div>
        </div>

        <!-- Right: Output -->
        <div class="output">
            <div class="output-header">
                <div class="panel-label">Output</div>
                <div id="outputActions"></div>
            </div>
            <div class="pipeline-bar" id="pipelineBar"></div>
            <div class="output-body">
                <div class="empty-state" id="emptyState">
                    <svg class="empty-state-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="8" y="14" width="20" height="3" rx="1.5" fill="currentColor"/>
                        <rect x="8" y="22" width="16" height="3" rx="1.5" fill="currentColor"/>
                        <rect x="8" y="30" width="20" height="3" rx="1.5" fill="currentColor"/>
                        <path d="M34 24l6 4-6 4v-8z" fill="currentColor"/>
                        <rect x="46" y="14" width="14" height="3" rx="1.5" fill="currentColor"/>
                        <rect x="46" y="22" width="10" height="3" rx="1.5" fill="currentColor"/>
                        <rect x="46" y="30" width="14" height="3" rx="1.5" fill="currentColor"/>
                        <rect x="8" y="42" width="52" height="8" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/>
                    </svg>
                    <p>Select a skill and upload a file to start transforming.</p>
                </div>
                <div class="loading-state" id="loadingState">
                    <div class="loading-ring"></div>
                    <p>Transforming data...</p>
                    <span class="loading-sub">Running through local LLM</span>
                </div>
                <div class="result-content" id="resultContent" style="display:none;"></div>
            </div>
        </div>
    </div>

    <footer>
        <span id="footerModel">Loading...</span>
        <span id="footerUrl"></span>
    </footer>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Log Panel -->
    <div class="log-panel-overlay" id="logOverlay" onclick="toggleLogPanel()"></div>
    <div class="log-panel" id="logPanel">
        <div class="log-panel-header">
            <h2>Logs</h2>
            <button class="modal-close" onclick="toggleLogPanel()" aria-label="Close log panel">&times;</button>
        </div>
        <div class="log-panel-toolbar">
            <button class="log-filter-btn active" onclick="setLogFilter('ALL', this)">All</button>
            <button class="log-filter-btn" onclick="setLogFilter('INFO', this)">Info</button>
            <button class="log-filter-btn" onclick="setLogFilter('WARNING', this)">Warn</button>
            <button class="log-filter-btn" onclick="setLogFilter('ERROR', this)">Error</button>
            <span class="log-panel-count" id="logCount">0</span>
        </div>
        <div class="log-panel-body" id="logBody"></div>
    </div>

    <!-- Confirm Modal -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal" style="width:400px;">
            <div class="modal-header">
                <h2 id="confirmTitle">Confirm</h2>
                <button class="modal-close" onclick="closeConfirm()" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <p id="confirmMessage" style="font-size:0.88rem;line-height:1.5;color:var(--text-secondary);"></p>
            </div>
            <div class="modal-footer">
                <button class="btn-modal secondary" onclick="closeConfirm()">Cancel</button>
                <button class="btn-modal primary" id="confirmOk" style="background:var(--error);border-color:var(--error);">Delete</button>
            </div>
        </div>
    </div>

    <!-- Skill Editor Modal -->
    <div class="modal-overlay" id="skillModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Edit Skill</h2>
                <button class="modal-close" onclick="closeSkillModal()" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <textarea id="skillEditor" spellcheck="false"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn-modal secondary" onclick="closeSkillModal()">Cancel</button>
                <button class="btn-modal primary" onclick="saveSkill()">Save</button>
            </div>
        </div>
    </div>

    <script>
        let selectedSkill = null;
        let selectedFile = null;
        let editingSkillId = null;

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function showToast(msg, isError) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => t.className = 'toast', 2500);
        }

        // --- Footer config ---
        fetch('/api/config').then(r => r.json()).then(c => {
            document.getElementById('footerModel').textContent = c.model;
            document.getElementById('footerUrl').textContent = c.base_url.replace('http://', '').replace('/v1', '');
        }).catch(() => {});

        // --- Skills ---
        function loadSkills() {
            fetch('/api/skills')
                .then(r => r.json())
                .then(skills => {
                    const grid = document.getElementById('skillsGrid');
                    grid.innerHTML = '';
                    skills.forEach(s => {
                        const div = document.createElement('div');
                        div.className = 'skill-option';
                        div.tabIndex = 0;
                        div.setAttribute('role', 'radio');
                        div.setAttribute('aria-checked', s.id === selectedSkill ? 'true' : 'false');
                        if (s.id === selectedSkill) div.classList.add('selected');

                        const tagClass = s.category === 'example' ? 'example' : 'custom';
                        const tagLabel = s.category === 'example' ? 'Example' : 'Custom';

                        div.innerHTML = `
                            <div class="skill-radio"><div class="skill-radio-dot"></div></div>
                            <div class="skill-info">
                                <h3>${escapeHtml(s.name)}</h3>
                                <p>${escapeHtml(s.description)}</p>
                                <div class="skill-meta">
                                    <span class="skill-tag ${tagClass}">${tagLabel}</span>
                                </div>
                            </div>
                            <div class="skill-actions">
                                <button class="skill-action-btn" title="Edit" aria-label="Edit skill ${escapeHtml(s.name)}" data-skill-id="${s.id}" onclick="event.stopPropagation(); openSkillEditor('${s.id}')">
                                    <svg viewBox="0 0 13 13" fill="none"><path d="M9.5 1.5l2 2L4 11H2V9L9.5 1.5z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </button>
                                <button class="skill-action-btn delete" title="Delete" aria-label="Delete skill ${escapeHtml(s.name)}" onclick="event.stopPropagation(); deleteSkill('${s.id}', '${escapeHtml(s.name)}')">
                                    <svg viewBox="0 0 13 13" fill="none"><path d="M2 3.5h9M4.5 3.5V2.5a1 1 0 011-1h2a1 1 0 011 1v1M5 6v3.5M8 6v3.5M3.5 3.5l.5 7.5a1 1 0 001 1h3a1 1 0 001-1l.5-7.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </button>
                            </div>`;
                        div.onclick = () => selectSkill(div, s.id);
                        div.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectSkill(div, s.id); } };
                        grid.appendChild(div);
                    });
                })
                .catch(() => {
                    document.getElementById('statusDot').classList.remove('connected');
                    document.getElementById('statusText').textContent = 'Server unreachable';
                });
        }

        function selectSkill(div, id) {
            document.querySelectorAll('.skill-option').forEach(el => {
                el.classList.remove('selected');
                el.setAttribute('aria-checked', 'false');
            });
            div.classList.add('selected');
            div.setAttribute('aria-checked', 'true');
            selectedSkill = id;
            updateBtn();
        }

        loadSkills();

        // --- File upload ---
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            selectedFile = file;
            uploadZone.classList.add('has-file');
            const inner = uploadZone.querySelector('.upload-icon');
            const textEl = uploadZone.querySelector('.upload-text');
            const existingBadge = uploadZone.querySelector('.file-badge');
            const existingSize = uploadZone.querySelector('.file-size');
            if (existingBadge) existingBadge.remove();
            if (existingSize) existingSize.remove();
            if (textEl) textEl.remove();

            const badge = document.createElement('div');
            badge.className = 'file-badge';
            badge.textContent = file.name;
            inner.insertAdjacentElement('afterend', badge);

            const size = document.createElement('div');
            size.className = 'file-size';
            size.textContent = (file.size / 1024).toFixed(1) + ' KB';
            badge.insertAdjacentElement('afterend', size);

            updateBtn();
        }

        function clearFile() {
            selectedFile = null;
            fileInput.value = '';
            uploadZone.classList.remove('has-file');
            const badge = uploadZone.querySelector('.file-badge');
            const size = uploadZone.querySelector('.file-size');
            if (badge) badge.remove();
            if (size) size.remove();
            if (!uploadZone.querySelector('.upload-text')) {
                const inner = uploadZone.querySelector('.upload-icon');
                const p = document.createElement('p');
                p.className = 'upload-text';
                p.innerHTML = '<strong>Drop file</strong> or click to browse';
                inner.insertAdjacentElement('afterend', p);
            }
            updateBtn();
        }

        function updateBtn() {
            document.getElementById('processBtn').disabled = !(selectedSkill && selectedFile);
        }

        // --- Process ---
        async function processFile() {
            const btn = document.getElementById('processBtn');
            if (btn.disabled) return;

            const emptyState = document.getElementById('emptyState');
            const loadingState = document.getElementById('loadingState');
            const resultContent = document.getElementById('resultContent');
            const pipelineBar = document.getElementById('pipelineBar');
            const outputActions = document.getElementById('outputActions');

            btn.disabled = true;
            emptyState.style.display = 'none';
            resultContent.style.display = 'none';
            loadingState.classList.add('visible');
            pipelineBar.classList.add('active');
            outputActions.innerHTML = '';

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('skill_id', selectedSkill);

            try {
                const res = await fetch('/api/process', { method: 'POST', body: formData });
                const data = await res.json();

                loadingState.classList.remove('visible');
                pipelineBar.classList.remove('active');
                resultContent.style.display = 'block';

                if (data.error) {
                    resultContent.innerHTML = `<div class="error-box">${escapeHtml(data.error)}</div>`;
                    if (data.raw_output) {
                        resultContent.innerHTML += `<pre class="result-text-output" style="margin-top:0.75rem">${escapeHtml(data.raw_output)}</pre>`;
                    }
                    showToast('Transform failed', true);
                } else if (data.files) {
                    let html = `<div class="result-badge"><svg viewBox="0 0 12 12" fill="none"><path d="M10 3L4.5 8.5 2 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>${data.files.length} files generated</div>`;
                    data.files.forEach(f => {
                        html += `<div class="file-section-label">${escapeHtml(f.file)}<a class="btn-download-sm" href="${f.download}" download><svg viewBox="0 0 14 14" fill="none"><path d="M7 2v8M4 7l3 3 3-3M2 12h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div>`;
                        html += renderTable(f.preview, f.row_count);
                    });
                    html += renderValidation(data.validation);
                    resultContent.innerHTML = html;
                    if (data.download_zip) {
                        outputActions.innerHTML = `<a class="btn-download" href="${data.download_zip}" download><svg viewBox="0 0 14 14" fill="none"><path d="M7 2v8M4 7l3 3 3-3M2 12h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>Download ZIP</a>`;
                    }
                    showToast(`${data.files.length} files generated`);
                } else if (data.preview) {
                    let html = `<div class="result-badge"><svg viewBox="0 0 12 12" fill="none"><path d="M10 3L4.5 8.5 2 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Transform complete</div>`;
                    html += renderTable(data.preview, data.row_count);
                    html += renderValidation(data.validation);
                    resultContent.innerHTML = html;
                    if (data.download) {
                        outputActions.innerHTML = `<a class="btn-download" href="${data.download}" download><svg viewBox="0 0 14 14" fill="none"><path d="M7 2v8M4 7l3 3 3-3M2 12h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>Download</a>`;
                    }
                    showToast('Transform complete');
                } else if (data.result) {
                    resultContent.innerHTML = `<div class="result-badge"><svg viewBox="0 0 12 12" fill="none"><path d="M10 3L4.5 8.5 2 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Analysis complete</div><pre class="result-text-output">${escapeHtml(data.result)}</pre>`;
                    showToast('Analysis complete');
                }
            } catch (err) {
                loadingState.classList.remove('visible');
                pipelineBar.classList.remove('active');
                resultContent.style.display = 'block';
                resultContent.innerHTML = `<div class="error-box">Connection failed: ${escapeHtml(err.message)}</div>`;
                showToast('Connection failed', true);
            }

            btn.disabled = false;
        }

        function renderValidation(validation) {
            if (!validation) return '';
            const { passed, error_count, warning_count, issues } = validation;

            let statusClass = passed ? 'validation-passed' : 'validation-failed';
            let statusText = passed ? 'Validation passed' : 'Validation failed';
            let statsHtml = '';
            if (error_count > 0) statsHtml += `<span class="v-errors">${error_count} error${error_count > 1 ? 's' : ''}</span>`;
            if (warning_count > 0) statsHtml += `<span class="v-warnings">${warning_count} warning${warning_count > 1 ? 's' : ''}</span>`;
            if (error_count === 0 && warning_count === 0) statsHtml = '<span class="v-ok">All checks passed</span>';

            let issuesHtml = '';
            issues.forEach(issue => {
                let loc = issue.file;
                if (issue.row) loc += ` row ${issue.row}`;
                if (issue.column) loc += ` → ${issue.column}`;
                issuesHtml += `
                    <div class="validation-issue">
                        <span class="issue-tag ${issue.severity}">${issue.severity}</span>
                        <div>
                            <div class="issue-detail">${escapeHtml(issue.message)}</div>
                            <div class="issue-loc">${escapeHtml(loc)}</div>
                        </div>
                    </div>`;
            });

            const bodyId = 'vbody_' + Math.random().toString(36).slice(2, 8);
            return `
                <div class="validation-panel">
                    <div class="validation-header" onclick="document.getElementById('${bodyId}').classList.toggle('open')">
                        <span class="${statusClass}">${statusText}</span>
                        <div class="validation-stats">${statsHtml}</div>
                    </div>
                    <div class="validation-body ${issues.length > 0 ? 'open' : ''}" id="${bodyId}">
                        ${issuesHtml}
                    </div>
                </div>`;
        }

        function renderTable(preview, rowCount) {
            if (!preview || !preview.length) return '<p style="color:var(--text-muted)">No data</p>';
            const cols = Object.keys(preview[0]);
            let html = '<div class="table-container"><div class="table-scroll"><table><thead><tr>';
            cols.forEach(c => html += `<th>${escapeHtml(c)}</th>`);
            html += '</tr></thead><tbody>';
            preview.forEach(row => {
                html += '<tr>';
                cols.forEach(c => html += `<td>${escapeHtml(String(row[c] ?? ''))}</td>`);
                html += '</tr>';
            });
            html += '</tbody></table></div>';
            html += `<div class="table-footer"><span>${rowCount || preview.length} rows</span></div></div>`;
            return html;
        }

        // --- Skill editor ---
        async function openSkillEditor(skillId) {
            editingSkillId = skillId;
            document.getElementById('modalTitle').textContent = `Edit Skill — ${skillId}`;
            const res = await fetch(`/api/skills/${skillId}`);
            const data = await res.json();
            document.getElementById('skillEditor').value = data.content;
            document.getElementById('skillModal').classList.add('open');
        }

        function closeSkillModal() {
            document.getElementById('skillModal').classList.remove('open');
            editingSkillId = null;
        }

        async function saveSkill() {
            if (!editingSkillId) return;
            const content = document.getElementById('skillEditor').value;
            const form = new FormData();
            form.append('skill_content', content);
            const res = await fetch(`/api/skills/${editingSkillId}`, { method: 'PUT', body: form });
            const data = await res.json();
            if (data.status === 'success') {
                closeSkillModal();
                loadSkills();
                showToast('Skill saved');
            }
        }

        function deleteSkill(skillId, skillName) {
            showConfirm(
                'Delete Skill',
                `Are you sure you want to delete "${skillName}"? This action cannot be undone.`,
                async () => {
                    await fetch(`/api/skills/${skillId}`, { method: 'DELETE' });
                    if (selectedSkill === skillId) {
                        selectedSkill = null;
                        updateBtn();
                    }
                    loadSkills();
                    showToast('Skill deleted');
                }
            );
        }

        function showConfirm(title, message, onConfirm) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMessage').textContent = message;
            const okBtn = document.getElementById('confirmOk');
            const newBtn = okBtn.cloneNode(true);
            okBtn.parentNode.replaceChild(newBtn, okBtn);
            newBtn.addEventListener('click', () => { closeConfirm(); onConfirm(); });
            document.getElementById('confirmModal').classList.add('open');
        }

        function closeConfirm() {
            document.getElementById('confirmModal').classList.remove('open');
        }

        document.getElementById('confirmModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeConfirm();
        });

        async function uploadSkillFile(input) {
            const file = input.files[0];
            if (!file) return;
            const form = new FormData();
            form.append('skill_file', file);
            const res = await fetch('/api/upload-skill', { method: 'POST', body: form });
            const data = await res.json();
            if (data.status === 'success') {
                loadSkills();
                showToast(`Skill "${file.name}" uploaded`);
            }
            input.value = '';
        }

        document.getElementById('skillModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeSkillModal();
        });

        // --- Log Panel (SSE) ---
        let logAllEntries = [];
        let logFilter = 'ALL';
        let logPanelOpen = false;
        let logEventSource = null;

        function toggleLogPanel() {
            logPanelOpen = !logPanelOpen;
            document.getElementById('logPanel').classList.toggle('open', logPanelOpen);
            document.getElementById('logOverlay').classList.toggle('open', logPanelOpen);
            if (logPanelOpen && !logEventSource) {
                fetchLogs();
                connectLogStream();
            }
        }

        async function fetchLogs() {
            try {
                const res = await fetch('/api/logs?limit=500');
                const data = await res.json();
                logAllEntries = data.logs;
                renderLogs();
            } catch {}
        }

        function connectLogStream() {
            logEventSource = new EventSource('/api/logs/stream');
            logEventSource.onmessage = (e) => {
                const entry = JSON.parse(e.data);
                logAllEntries.push(entry);
                if (logAllEntries.length > 500) logAllEntries.shift();
                renderLogs();
            };
            logEventSource.onerror = () => {
                logEventSource.close();
                logEventSource = null;
                setTimeout(connectLogStream, 3000);
            };
        }

        function renderLogs() {
            const body = document.getElementById('logBody');
            const filtered = logFilter === 'ALL'
                ? logAllEntries
                : logAllEntries.filter(l => l.level === logFilter);
            document.getElementById('logCount').textContent = `${filtered.length} entries`;
            if (!filtered.length) {
                body.innerHTML = '<div class="log-empty">No logs yet</div>';
                return;
            }
            body.innerHTML = filtered.map(l => `<div class="log-entry">
                <span class="log-time">${escapeHtml(l.time).slice(11)}</span>
                <span class="log-level ${l.level}">${l.level}</span>
                <span class="log-message">${escapeHtml(l.message)}</span>
            </div>`).join('');
            body.scrollTop = body.scrollHeight;
        }

        function setLogFilter(level, btn) {
            logFilter = level;
            document.querySelectorAll('.log-filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderLogs();
        }

        connectLogStream();

        // --- Keyboard shortcuts ---
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (document.getElementById('skillModal').classList.contains('open')) { closeSkillModal(); return; }
                if (document.getElementById('confirmModal').classList.contains('open')) { closeConfirm(); return; }
                if (logPanelOpen) { toggleLogPanel(); return; }
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                processFile();
            }
        });
    </script>
</body>
</html>
